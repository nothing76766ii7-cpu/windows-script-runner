<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Window frame -->
  <rect x="18" y="22" width="92" height="84" rx="10" fill="#000000" stroke="url(#accent)" stroke-width="3"/>
  <rect x="18" y="22" width="92" height="22" rx="10" fill="#1e293b"/>
  <rect x="18" y="34" width="92" height="10" fill="#1e293b"/>
  <!-- Window dots -->
  <circle cx="32" cy="33" r="4" fill="#ef4444"/>
  <circle cx="44" cy="33" r="4" fill="#f59e0b"/>
  <circle cx="56" cy="33" r="4" fill="#10b981"/>
  <!-- Terminal Prompt >_ -->
  <path d="M34 60l14 12-14 12" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="56" y1="84" x2="78" y2="84" stroke="#4ade80" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Windows batch/powershell badge -->
  <rect x="74" y="54" width="28" height="16" rx="4" fill="#0284c7"/>
  <text x="88" y="66" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">BAT</text>
</svg>
