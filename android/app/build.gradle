plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vanta.wsr'
    compileSdk 34

    defaultConfig {
        applicationId "com.vanta.wsr"
        minSdk 24
        targetSdk 34
        versionCode 400
        versionName "4.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}
