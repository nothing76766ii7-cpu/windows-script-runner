[package]
name = "windows-script-runner"
version = "3.0.0"
edition = "2021"
authors = ["Rajdeep Yaduvanshi <vanta@antigem.dev>"]
description = "Windows File System (C:/D:/Z:), .bat/.cmd/.ps1/.vbs/.reg/.exe runner, and Android JNI/HTTP engine in pure Rust."
license = "MIT"

[lib]
name = "wsr_jni"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wsr"
path = "src/main.rs"

[[bin]]
name = "bat2sh"
path = "tools/bat2sh.rs"

[[bin]]
name = "reg_parser"
path = "tools/reg_parser.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
